<div class="login-wrapper">

  <div class="login-left">
    <div class="brand-block">
      <!-- Same brand icon as app.html sidebar -->
      <div class="brand-icon">
        <div class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
            <line x1="20" y1="4" x2="8.12" y2="15.88"/>
            <line x1="14.47" y1="14.48" x2="20" y2="20"/>
            <line x1="8.12" y1="8.12" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="brand-name">StrichPro</div>
      </div>
      <div class="brand-tagline">Tailor Management System</div>
    </div>
    <div class="login-illustration">
      <div class="illus-circle c1"></div>
      <div class="illus-circle c2"></div>
      <div class="illus-circle c3"></div>
      <div class="illus-text">
        <div class="illus-stat">124 <span>Customers</span></div>
        <div class="illus-stat">18 <span>Active Orders</span></div>
        <div class="illus-stat">42 <span>Fabrics</span></div>
      </div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">

      <div class="login-header">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-sub">Sign in to your StrichPro account</p>
      </div>

      @if (error) {
        <div class="alert-danger">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="field-group">
          <label class="field-label">Email</label>
          <div class="field-wrap">
            <i class="ti ti-mail field-icon"></i>
            <input type="email" class="field-input"
              placeholder="you@example.com"
              formControlName="email" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-wrap">
            <i class="ti ti-lock field-icon"></i>
            <input [type]="showPass ? 'text' : 'password'"
              class="field-input" placeholder="••••••••"
              formControlName="password" />
            <button type="button" class="toggle-pass" (click)="showPass = !showPass">
              <i class="ti" [class.ti-eye]="!showPass" [class.ti-eye-off]="showPass"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-signin" [disabled]="loading || form.invalid">
          @if (loading) {
            <span class="btn-spinner"></span>
            <span>Signing in...</span>
          } @else {
            <i class="ti ti-login"></i>
            <span>Sign In</span>
          }
        </button>

      </form>

      <div class="divider"><span>or</span></div>

      <button class="btn-google" (click)="loginWithGoogle()" [disabled]="loading">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="login-footer">
        Don't have an account?
        <a routerLink="/register" class="login-link">Register here</a>
      </p>

    </div>
  </div>

</div>
