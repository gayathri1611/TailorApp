<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow" style="width: 400px;">
    <div class="card-body p-4">
      <h4 class="text-center mb-1">StrichPro</h4>
      <p class="text-center text-muted mb-4">Sign in to your account</p>

      <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading || form.invalid">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          Sign In
        </button>
      </form>
    </div>
  </div>
</div>
