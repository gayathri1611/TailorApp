<div class="container mt-4" style="max-width: 860px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>{{ isEdit ? 'Edit Order' : 'New Order' }}</h4>
    <a routerLink="/orders" class="btn btn-sm btn-outline-secondary">← Back</a>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border spinner-border-sm text-primary"></div>
    <span class="ms-2">Loading...</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">

    <!-- Order Info -->
    <div class="card mb-3">
      <div class="card-header fw-semibold">Order Details</div>
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label">Customer <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="customerId" [attr.disabled]="isEdit ? true : null">
            <option [ngValue]="null" disabled>Select customer</option>
            <option *ngFor="let c of customers" [ngValue]="c.customerId">
              {{ c.firstName }} {{ c.lastName }} ({{ c.customerCode }})
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Delivery Date</label>
          <input type="date" class="form-control" formControlName="deliveryDate" />
        </div>
        <div class="col-md-6" *ngIf="isEdit">
          <label class="form-label">Status</label>
          <select class="form-select" formControlName="status">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea class="form-control" rows="2" formControlName="notes"></textarea>
        </div>
      </div>
    </div>

    <!-- Order Items -->
    <div class="card mb-3">
      <div class="card-header fw-semibold d-flex justify-content-between align-items-center">
        <span>Garment Items</span>
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="addItem()">+ Add Item</button>
      </div>
      <div class="card-body" formArrayName="orderItems">
        <div *ngFor="let item of orderItemsArray.controls; let i = index" [formGroupName]="i"
          class="border rounded p-3 mb-3 position-relative">

          <button *ngIf="orderItemsArray.length > 1" type="button"
            class="btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-2"
            (click)="removeItem(i)">✕</button>

          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Garment Type <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="garmentType"
                placeholder="e.g. Shirt, Pant, Blouse" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" formControlName="description" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Qty</label>
              <input type="number" class="form-control" formControlName="quantity" min="1" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Unit Price (₹)</label>
              <input type="number" step="0.01" class="form-control" formControlName="unitPrice" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Fabric Details</label>
              <input type="text" class="form-control" formControlName="fabricDetails" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Special Instructions</label>
              <input type="text" class="form-control" formControlName="specialInstructions" />
            </div>
            <div class="col-12 text-end">
              <small class="text-muted">Item Total: <strong>₹{{ getItemTotal(i) }}</strong></small>
            </div>
          </div>
        </div>
      </div>
      <div class="card-footer text-end fw-semibold">
        Grand Total: ₹{{ grandTotal }}
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving || form.invalid">
        <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isEdit ? 'Update' : 'Place Order' }}
      </button>
      <a routerLink="/orders" class="btn btn-outline-secondary">Cancel</a>
    </div>

  </form>
</div>
